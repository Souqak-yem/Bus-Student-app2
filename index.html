  <body>
    <!-- Splash Screen -->
    <div id="splash" style="position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 9999;">
      <img src="/full-logo.svg" alt="تنسيقية مواصلات فلك" style="width: 180px; height: 180px; object-fit: contain;" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash screen once app is loaded
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.style.display = 'none';
        }, 500);
      });
    </script>
